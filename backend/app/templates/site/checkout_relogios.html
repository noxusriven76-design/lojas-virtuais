<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Checkout | {{ store.name }}</title><link rel="icon" href="{{ theme_asset_base }}/assets/img/favicon.svg" type="image/svg+xml"/><link rel="stylesheet" href="{{ theme_asset_base }}/assets/css/styles.css"/></head>
<body class="watch-site"><a class="skip-link" href="#conteudo">Pular para conteudo</a><div class="utility-bar"><div class="container utility-inner"><p>Frete expresso para todo o Brasil</p><p>Parcelamento em ate 10x sem juros</p></div></div><header class="site-header"><div class="container header-inner"><a class="brand watch-brand" href="/site/{{ store.slug }}">{% if store.logo_url %}<img src="{{ store.logo_url }}" alt="{{ store.name }}" width="220" height="48"/>{% else %}<img src="{{ theme_asset_base }}/assets/img/brand/logo.svg" alt="{{ store.name }}" width="220" height="48"/>{% endif %}</a></div></header><div class="container breadcrumbs watch-breadcrumbs"><a href="/site/{{ store.slug }}">Inicio</a> / <a href="/site/{{ store.slug }}/cart">Carrinho</a> / <span>Checkout</span></div><main id="conteudo" class="container"><section class="section"><div class="cart"><section class="form"><h1>Checkout</h1><p>Formulario SSR base pronto para integrar criacao de pedido.</p><div class="field"><label class="label">Nome</label><input class="input" type="text" placeholder="Seu nome"/></div><div class="field"><label class="label">Email</label><input class="input" type="email" placeholder="seu@email.com"/></div><div class="field"><label class="label">Endereco</label><input class="input" type="text" placeholder="Rua, numero"/></div><button class="btn btn-primary" type="button">Finalizar pedido</button></section><aside class="summary"><h2>Resumo</h2><div class="summary-row"><span>Total</span><strong>R$ 0,00</strong></div></aside></div></section></main></body></html>
