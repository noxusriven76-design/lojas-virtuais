name: Technical Audit

on:
  pull_request:
  push:
    branches: ["main", "master"]

jobs:
  hygiene-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend test dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Repository hygiene checks
        run: bash scripts/check_repo_hygiene.sh

      - name: Backend tenant/security tests
        working-directory: backend
        run: python -m pytest tests/test_tenant_isolation.py tests/test_admin_security_and_uploads.py -q
