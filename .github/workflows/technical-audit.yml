name: Quality Gate

on:
  pull_request:
  push:
    branches: ["main", "master"]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend test dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Install backend security scanner
        run: python -m pip install pip-audit

      - name: Repository hygiene checks
        run: bash scripts/check_repo_hygiene.sh

      - name: Backend compile check
        working-directory: backend
        run: python -m py_compile app/main.py app/api/routes/admin_access.py app/api/routes/admin_catalog.py

      - name: Backend tests (tenant/security/e2e/payments)
        working-directory: backend
        run: |
          python -m pytest \
          tests/test_tenant_isolation.py \
          tests/test_admin_security_and_uploads.py \
          tests/test_admin_e2e_phase9.py \
          tests/test_payments_webhook_phase2.py \
          tests/test_admin_payments_phase3.py \
          tests/test_payments_permissions_phase5.py \
          tests/test_payments_webhook_idempotency_phase6.py \
          tests/test_payments_e2e_phase6.py \
          tests/test_payments_isolation_phase6.py \
          -q

      - name: Backend dependency security scan
        working-directory: backend
        run: pip-audit -r requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend install
        working-directory: admin_panel
        run: npm ci

      - name: Frontend typecheck + build
        working-directory: admin_panel
        run: npm run build

      - name: Frontend dependency security scan
        working-directory: admin_panel
        run: npm audit --omit=dev --audit-level=high
